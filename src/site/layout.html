<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#282020">
<meta name="robots" content="{{robots}}">
{{canonical}}
<link rel="icon" type="image/svg+xml" href="{{root}}favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pixling">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
{{ogurl}}
<meta property="og:image" content="{{base}}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base}}/assets/og-image.png">
<link rel="stylesheet" href="{{root}}assets/fonts.css">
<link rel="stylesheet" href="{{root}}assets/site.css">
{{jsonld}}
</head>
<body>
<div class="topbar">
  <div class="wrap tb">
    <div class="l"></div>
    <a href="{{home}}" class="logo" aria-label="Pixling, home"><canvas id="wordmark" data-fg="#FCF8F0" data-bit="0.5"></canvas></a>
    <div class="r"><a class="btn step sm tbbtn" href="{{home}}#preorder">pre-order <span class="arr step sm"><canvas class="px-arrow" width="7" height="7" style="width:12px;height:12px"></canvas></span></a></div>
  </div>
</div>

<header class="phero">
  <div class="stars" aria-hidden="true"></div>
  <div class="wrap">
    <div class="in">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{h1}}<span class="sp">.</span></h1>
      <p class="lead">{{lead}}</p>
    </div>
  </div>
  {{art}}
  <div class="stairs" aria-hidden="true"></div>
</header>

<main>
{{body}}
</main>

<div class="wrap">
  {{cta}}
  <footer>
    <span>© 2026 Pixling</span>
    <nav aria-label="Footer">{{footnav}}</nav>
  </footer>
</div>
<script src="{{root}}assets/site.js" defer></script>
</body>
</html>
